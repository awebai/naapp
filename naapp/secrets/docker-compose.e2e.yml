# The H owner-acts journey (tests/test_e2e_owner_acts.py). The lane runs Logs
# under the "logs" profile as the audit target for owner designation.
# The test writes NAAPP_E2E_RUNTIME (DNS zone, TLS, keys, member files)
# before it starts each service, and drives the real aw only inside the cli
# containers. Everything is disposable: generated keys, tmpfs databases.
services:
  dns:
    extends: {file: "${NAAPP_E2E_BASE_COMPOSE:?}", service: dns}

  postgres:
    extends: {file: "${NAAPP_E2E_BASE_COMPOSE:?}", service: postgres}

  redis:
    extends: {file: "${NAAPP_E2E_BASE_COMPOSE:?}", service: redis}

  awid:
    extends: {file: "${NAAPP_E2E_BASE_COMPOSE:?}", service: awid}

  aweb:
    extends: {file: "${NAAPP_E2E_BASE_COMPOSE:?}", service: aweb}

  smtp:
    image: axllent/mailpit:v1.27
    networks:
      default:
        aliases: ["smtp.svc.test"]

  # The production image, as a customer runs it: HTTP behind a TLS front.
  secrets:
    build:
      context: ../..
      dockerfile: naapp/secrets/Dockerfile
      args:
        SOURCE_COMMIT: "${SECRETS_E2E_SOURCE_COMMIT:?}"
    dns: ["${NAAPP_E2E_DNS_IP:-127.0.0.11}"]
    env_file: ["${NAAPP_E2E_RUNTIME:?}/secrets.env"]
    volumes:
      - "${NAAPP_E2E_RUNTIME:?}/keys:/run/secrets-keys:ro"
    depends_on:
      postgres: {condition: service_healthy}
      awid: {condition: service_started}
      smtp: {condition: service_started}

  # Terminates TLS for the coordination server and the apps, keeping the
  # public Host used by the apps' split_origins allowlist.
  front:
    extends: {file: "${NAAPP_E2E_BASE_COMPOSE:?}", service: front}

  # The real aw. The holder's human key lives in this container's own
  # Secret Service (dbus + gnome-keyring); the controller runs in another one.
  cli:
    extends: {file: "${NAAPP_E2E_BASE_COMPOSE:?}", service: cli}

  browser:
    build: {context: ../.., dockerfile: naapp/secrets/e2e/owner_acts/browser.Dockerfile}
    profiles: ["browser"]

  logs:
    profiles: ["logs"]
    extends: {file: ../logs/compose.logs.yaml, service: logs}
    build:
      context: ../..
      dockerfile: naapp/logs/Dockerfile
      args:
        SOURCE_COMMIT: "${SECRETS_E2E_SOURCE_COMMIT:?}"
    restart: "no"
    dns: ["${NAAPP_E2E_DNS_IP:-127.0.0.11}"]
    environment:
      APP_ENV: development
      SSL_CERT_FILE: /runtime/tls/ca.pem
    volumes:
      - "${NAAPP_E2E_RUNTIME:?}/logs:/run/secrets/logs:ro"
      - "${NAAPP_E2E_RUNTIME:?}/tls:/runtime/tls:ro"
    depends_on:
      postgres: {condition: service_healthy}
      awid: {condition: service_started}
      smtp-tls: {condition: service_started}

  # The captured notification transport: TLS and authentication, as the
  # mailers require, with the mailbox read only by the test driver.
  smtp-tls:
    profiles: ["logs"]
    image: axllent/mailpit:v1.27
    environment:
      MP_SMTP_TLS_CERT: /runtime/tls/smtp.pem
      MP_SMTP_TLS_KEY: /runtime/tls/smtp-key.pem
      MP_SMTP_REQUIRE_STARTTLS: "true"
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
    volumes:
      - "${NAAPP_E2E_RUNTIME:?}/tls:/runtime/tls:ro"
    networks:
      default:
        aliases: ["mail.svc.test"]

  chromium:
    build: {context: ../.., dockerfile: naapp/secrets/e2e/browser/chromium.Dockerfile}
    profiles: ["chromium"]
