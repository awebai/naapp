# Secrets' journey helper, published for the servers repository's deployment
# journey. It ships team_journey_support.py alone and versions with Secrets
# (the secrets-v tag).
[project]
name = "aweb-naapp-journey-support"
version = "0.1.0"
description = "The aw journey helper the Secrets team journey and the servers deployment journey drive"
license = { text = "MIT" }
authors = [{ name = "aweb.ai", email = "hello@aweb.ai" }]
requires-python = ">=3.12"
dependencies = ["aweb-naapp-testing>=0.6.0", "pexpect>=4.9.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["team_journey_support.py"]

[tool.hatch.build.targets.sdist]
only-include = ["team_journey_support.py", "pyproject.toml"]
