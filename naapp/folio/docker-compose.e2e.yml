# Folio's real-stack journeys (tests/test_e2e_*.py) on the shared ComposeLane
# services. The tests write NAAPP_E2E_RUNTIME (DNS zone, TLS, the env files and
# the app keys) before they start a service, and drive the real aw only inside
# the cli containers. Everything is disposable: generated keys, tmpfs databases.
#
# Folio runs from its production image, each deployment at its own origin
# behind the TLS front: with the AWID service token, without it, and as a
# deployment with its own app id that a resident's grant installs. Each lists
# the lane's coordination server as its operator's team server, inside the
# lane's network.
x-folio: &folio
  build:
    context: ../..
    dockerfile: naapp/folio/Dockerfile
  dns: ["${NAAPP_E2E_DNS_IP:-127.0.0.11}"]
  volumes:
    - "${NAAPP_E2E_RUNTIME:?}/folio-keys:/run/folio-keys:ro"
    - "${NAAPP_E2E_RUNTIME:?}/tls/ca.pem:/run/folio-ca/ca.pem:ro"
  depends_on:
    postgres: {condition: service_healthy}
    awid: {condition: service_started}

services:
  dns:
    extends: {file: "${NAAPP_E2E_BASE_COMPOSE:?}", service: dns}

  postgres:
    extends: {file: "${NAAPP_E2E_BASE_COMPOSE:?}", service: postgres}

  redis:
    extends: {file: "${NAAPP_E2E_BASE_COMPOSE:?}", service: redis}

  awid:
    extends: {file: "${NAAPP_E2E_BASE_COMPOSE:?}", service: awid}

  aweb:
    extends: {file: "${NAAPP_E2E_BASE_COMPOSE:?}", service: aweb}

  # The production image, as an operator runs it: HTTP behind the TLS front.
  folio:
    <<: *folio
    env_file: ["${NAAPP_E2E_RUNTIME:?}/folio.env"]

  folio-without-token:
    <<: *folio
    env_file: ["${NAAPP_E2E_RUNTIME:?}/folio-without-token.env"]

  folio-install:
    <<: *folio
    env_file: ["${NAAPP_E2E_RUNTIME:?}/folio-install.env"]

  # Chromium for the browser journeys, on the lane's network and DNS, where
  # the Folio origins resolve. The tests connect to its Playwright server on
  # a loopback port of the runner, which the second network carries: the lane's
  # own network is internal. The image is the Playwright release Folio's
  # uv.lock pins (playwright==1.63.0); bump the two together.
  playwright:
    image: mcr.microsoft.com/playwright/python:v1.63.0-noble@sha256:72bd171a9ffc2b4b59532aaa6210e21014d07093120dc25528870c0b840da1f0
    init: true
    dns: ["${NAAPP_E2E_DNS_IP:-127.0.0.11}"]
    command: ["playwright", "run-server", "--host", "0.0.0.0", "--port", "3000"]
    networks: [default, browser-control]
    ports:
      - "127.0.0.1::3000"

  # Terminates TLS for the coordination server and the Folio origins, keeping
  # the public Host each deployment checks.
  front:
    extends: {file: "${NAAPP_E2E_BASE_COMPOSE:?}", service: front}

  # The real aw, the pinned release mounted read-only.
  cli:
    extends: {file: "${NAAPP_E2E_BASE_COMPOSE:?}", service: cli}

networks:
  browser-control: {}
