name: naapp CI

# Lint, type-check and test the runtime and every app, with their browser tests,
# shards and real-stack e2e journeys. Tests fail on any warning (each package's
# pyproject sets filterwarnings = ["error"]), so a passing run is a clean run.
#
# Every step calls a root Makefile target, so any runner can run the same
# checks: make sync, lint and test PACKAGES=<package>, and the e2e targets.
#
# Which packages a pull request tests is decided by scripts/affected_packages.py,
# never by a path filter: a changed path selects its package and every package
# that depends on it, and a path inside no package selects them all. A push to
# main and a manual run test everything. The "naapp CI" job is the single
# required check: scripts/ci_result.py fails it unless every selected job
# succeeded.
#
# Folio's document-change and browser-wake acceptance (aweb's
# scripts/e2e-folio-wakes.sh) is not run here: it tests aweb's server and
# channel-core against a real Folio, so it stays in aweb's gate against a
# published Folio image by digest.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per ref at a time. On a pull request a newer run replaces the running
# one. On main the running one finishes and the newest push waits behind it,
# replacing any older waiting run, so main's long jobs complete while several
# seats push.
concurrency:
  group: naapp-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Select the affected packages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      packages: ${{ steps.select.outputs.packages }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select
        id: select
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            packages=$(make -s affected BASE="$BASE")
          else
            packages=$(python3 scripts/affected_packages.py --all)
          fi
          echo "packages=$packages" >> "$GITHUB_OUTPUT"
          echo "Selected: $packages"

  scripts:
    name: Repository scripts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Lint the scripts
        run: make lint-scripts

      - name: Test the selection, digests, shards and test infrastructure
        run: make test-scripts

  # The files a PyPI release uploads, built twice and identical, each lane's
  # wheels installed by path and imported, kept as this run's artifact. A
  # release tag locks their sha256 (scripts/release_files.py, docs/release.md).
  release-files:
    name: PyPI release files
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build, lock and install-check the release files
        run: python3 scripts/release_files.py build --out release-files

      - name: Keep the release files
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release-files/
          if-no-files-found: error

  # Two shards that together are the whole suite: tests/runtime, and every
  # other test. Either shard failing fails the job.
  naapp-lib:
    name: naapp-lib lint and tests (${{ matrix.shard }})
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'naapp-lib')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: runtime
            tests: tests/runtime
          - shard: rest
            tests: --ignore=tests/runtime
    env:
      JUNIT_DIR: ${{ github.workspace }}/junit
      PACKAGES: naapp-lib
      NAAPP_LIB_TESTS: ${{ matrix.tests }}
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Redis for the cached-registry tests, and for the production AWID the
      # fixture starts, which does not start without it.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: naapp-lib/uv.lock

      - name: Install locked dependencies
        run: make sync

      # The runtime's console tests exercise real WebAuthn in Chromium.
      - name: Install the test browser
        run: make browsers

      # The page renderer runs in the rest shard only, which holds the
      # store/renderer browser test (tests/page_store).
      - name: Set up Node
        if: matrix.shard == 'rest'
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install the page renderer's locked packages and browser
        if: matrix.shard == 'rest'
        run: make renderer-deps

      - name: Lint and type-check
        run: make lint

      # The tests back up and restore with the client of the server's major version.
      - name: Install the PostgreSQL client of the server's major version
        run: |
          sudo bash scripts/test-egress/install-postgres-client.sh
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      # Behind the test egress guard, which forwards the governance browser's RP
      # host to loopback for Chromium and Playwright's driver.
      - name: Run tests offline against real PostgreSQL and Redis
        run: make test

      - name: Run the page renderer's tests
        if: matrix.shard == 'rest'
        run: make test-renderer

      - name: Keep the per-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.job }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: junit/
          if-no-files-found: warn

  folio:
    name: Folio lint and tests
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'naapp/folio')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JUNIT_DIR: ${{ github.workspace }}/junit
      PACKAGES: naapp/folio
      REDIS_URL: redis://localhost:6379/0
      TEST_DB_HOST: localhost
      TEST_DB_PORT: "5432"
      TEST_DB_USER: postgres
      TEST_DB_PASSWORD: postgres
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: naapp/folio/uv.lock

      - name: Install locked dependencies
        run: make sync

      - name: Install the test browser
        run: make browsers

      - name: Lint and type-check
        run: make lint

      - name: Install the PostgreSQL client of the server's major version
        run: |
          sudo bash scripts/test-egress/install-postgres-client.sh
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - name: Run unit and contract tests
        run: make test

      - name: Keep the per-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.job }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: junit/
          if-no-files-found: warn

  folio-e2e:
    name: Folio real-stack e2e
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'naapp/folio')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTEST_ADDOPTS: --junitxml=${{ github.workspace }}/junit/folio-e2e.xml
      PACKAGES: naapp/folio
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: naapp/folio/uv.lock

      - name: Install locked dependencies
        run: make sync

      # The smoke drives Folio's present pages in Chromium.
      - name: Install the test browser
        run: make browsers

      - name: Install the pinned aw release
        run: make aw

      # The stack runs the published awid image pinned in
      # naapp/folio/docker-compose.e2e.yml.
      - name: Run real-stack e2e
        run: make e2e-folio

      - name: Keep the per-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.job }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: junit/
          if-no-files-found: warn

  folio-image:
    name: Folio image starts and serves
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'naapp/folio')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACKAGES: naapp/folio
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Built from the repository root as the release builds it, started with a
      # minimal configuration; /live must name Folio and this build's commit.
      - name: Build the Folio image and check it serves
        env:
          IMAGE_SMOKE_SHA: ${{ github.sha }}
          IMAGE_SMOKE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: make image-smoke-folio

  library:
    name: Library lint and tests
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'naapp/library')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JUNIT_DIR: ${{ github.workspace }}/junit
      PACKAGES: naapp/library
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: naapp/library/uv.lock

      - name: Install locked dependencies
        run: make sync

      - name: Lint and type-check
        run: make lint

      - name: Validate the AATK structural contract
        run: make check-library-aatk

      - name: Run unit and contract tests
        run: make test

      # A developer's targets work from a clone: make compile, and make run
      # serves /live against this job's database.
      - name: Library's developer targets work
        env:
          LIBRARY_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: make check-library-dev

      - name: Keep the per-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.job }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: junit/
          if-no-files-found: warn

  library-e2e:
    name: Library real-stack e2e
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'naapp/library')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTEST_ADDOPTS: --junitxml=${{ github.workspace }}/junit/library-e2e.xml
      PACKAGES: naapp/library
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: naapp/library/uv.lock

      - name: Install locked dependencies
        run: make sync

      - name: Install the pinned aw release
        run: make aw

      # The stack runs the published awid image pinned in
      # naapp/library/docker-compose.e2e.yml, and the pre-status registry built
      # from its pinned aweb commit.
      - name: Run real-stack e2e
        run: make e2e-library

      - name: Keep the per-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.job }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: junit/
          if-no-files-found: warn

  library-image:
    name: Library image starts and serves
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'naapp/library')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACKAGES: naapp/library
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Built from the repository root as the release builds it, started with a
      # minimal configuration; /live must name Library and this build's commit.
      - name: Build the Library image and check it serves
        env:
          IMAGE_SMOKE_SHA: ${{ github.sha }}
          IMAGE_SMOKE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: make image-smoke-library

  logs:
    name: Logs lint and tests
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'naapp/logs')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JUNIT_DIR: ${{ github.workspace }}/junit
      PACKAGES: naapp/logs
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The production AWID the fixture starts does not start without Redis.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: naapp/logs/uv.lock

      - name: Install locked dependencies
        run: make sync

      - name: Install the test browser
        run: make browsers

      - name: Lint and type-check
        run: make lint

      - name: Install the PostgreSQL client of the server's major version
        run: |
          sudo bash scripts/test-egress/install-postgres-client.sh
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - name: Run unit and contract tests
        run: make test

      - name: Keep the per-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.job }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: junit/
          if-no-files-found: warn

  secrets:
    name: Secrets lint and tests
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'naapp/secrets')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JUNIT_DIR: ${{ github.workspace }}/junit
      PACKAGES: naapp/secrets
      REDIS_URL: redis://localhost:6379/0
      UV_MANAGED_PYTHON: "true"
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The production AWID the fixture starts does not start without Redis.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Each Secrets shard runs against its own service pair; shard 1 uses the pair above.
      postgres_shard_2:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis_shard_2:
        image: redis:7
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres_shard_3:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis_shard_3:
        image: redis:7
        ports:
          - 6379/tcp
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: naapp/secrets/uv.lock

      - name: Install locked dependencies
        run: make sync

      - name: Check that the tests run on the uv-managed interpreter
        working-directory: naapp/secrets
        run: |
          managed_python=$(uv python find --system --resolve-links --managed-python "$UV_PYTHON")
          uv run --no-sync python - "$managed_python" <<'PY'
          import os
          import sys
          from pathlib import Path
          from stat import S_IMODE

          interpreter = Path(sys.executable).resolve()
          info = interpreter.stat()
          print(
              f"Python: {interpreter}, uid={info.st_uid}, "
              f"mode={S_IMODE(info.st_mode):04o}, test uid={os.geteuid()}"
          )
          if interpreter != Path(sys.argv[1]):
              raise SystemExit("Secrets CI must use the uv-managed interpreter")
          PY

      - name: Install the test browser
        run: make browsers

      - name: Lint and type-check
        run: make lint

      - name: Check that every test module is in exactly one shard
        run: make check-secrets-shards

      - name: Run unit and contract tests in every shard
        env:
          AWEB_SECRETS_SHARD_SERVICES: >-
            [{"postgres_port": 5432, "redis_port": 6379},
             {"postgres_port": ${{ job.services.postgres_shard_2.ports[5432] }},
              "redis_port": ${{ job.services.redis_shard_2.ports[6379] }}},
             {"postgres_port": ${{ job.services.postgres_shard_3.ports[5432] }},
              "redis_port": ${{ job.services.redis_shard_3.ports[6379] }}}]
          PYTEST_ADDOPTS: -rs
        run: make test

      - name: Keep the per-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.job }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: junit/
          if-no-files-found: warn

  secrets-e2e:
    name: Secrets owner-acts journey
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'naapp/secrets')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTEST_ADDOPTS: --junitxml=${{ github.workspace }}/junit/secrets-e2e.xml
      PACKAGES: naapp/secrets
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: naapp/secrets/uv.lock

      - name: Install locked dependencies
        run: make sync

      - name: Install the pinned aw release
        run: |
          make aw
          .tools/bin/aw version

      # The real aw against AWID, aweb and this app's image, with the holder's
      # human key in a real Secret Service, all in naapp/secrets/docker-compose.e2e.yml.
      - name: Run the owner-acts journey
        env:
          NAAPP_AW_BINARY: ${{ github.workspace }}/.tools/bin/aw
        run: make e2e-secrets

      - name: Keep the per-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.job }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: junit/
          if-no-files-found: warn

  secrets-runner:
    name: Secrets runner lint and tests
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'naapp/secrets/runner')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JUNIT_DIR: ${{ github.workspace }}/junit
      PACKAGES: naapp/secrets/runner
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: naapp/secrets/runner/uv.lock

      - name: Install locked dependencies
        run: make sync

      - name: Lint and type-check
        run: make lint

      - name: Run tests
        run: make test

      - name: Keep the per-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.job }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: junit/
          if-no-files-found: warn

  secrets-values:
    name: Secrets values codec lint and tests
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'naapp/secrets/values')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JUNIT_DIR: ${{ github.workspace }}/junit
      PACKAGES: naapp/secrets/values
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: naapp/secrets/values/uv.lock

      - name: Install locked dependencies
        run: make sync

      - name: Lint and type-check
        run: make lint

      - name: Run tests
        run: make test

      - name: Keep the per-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.job }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: junit/
          if-no-files-found: warn

  tasks:
    name: Tasks lint and tests
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'naapp/tasks')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JUNIT_DIR: ${{ github.workspace }}/junit
      PACKAGES: naapp/tasks
      REDIS_URL: redis://localhost:6379/0
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The production AWID the fixture starts does not start without Redis.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: naapp/tasks/uv.lock

      - name: Install locked dependencies
        run: make sync

      - name: Lint and type-check
        run: make lint

      - name: Install the PostgreSQL client of the server's major version
        run: |
          sudo bash scripts/test-egress/install-postgres-client.sh
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - name: Run unit and contract tests
        run: make test

      - name: Keep the per-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-${{ github.job }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
          path: junit/
          if-no-files-found: warn

  tasks-image:
    name: Tasks image starts and serves
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.packages), 'naapp/tasks')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PACKAGES: naapp/tasks
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Built from the repository root as the release builds it, started with a
      # minimal configuration; /live must name Tasks and this build's commit.
      - name: Build the Tasks image and check it serves
        env:
          IMAGE_SMOKE_SHA: ${{ github.sha }}
          IMAGE_SMOKE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: make image-smoke-tasks

  result:
    name: naapp CI
    if: always()
    needs:
      - plan
      - scripts
      - release-files
      - naapp-lib
      - folio
      - folio-e2e
      - folio-image
      - library
      - library-e2e
      - library-image
      - logs
      - secrets
      - secrets-e2e
      - secrets-runner
      - secrets-values
      - tasks
      - tasks-image
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Every selected job succeeded
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
          CI_PACKAGES: ${{ needs.plan.outputs.packages || '[]' }}
        run: python3 scripts/ci_result.py
