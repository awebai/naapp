# Common private services for ComposeLane. App files extend these services.
services:
  dns:
    image: coredns/coredns:1.11.3
    command: ["-conf", "/zones/Corefile"]
    volumes:
      - "${NAAPP_E2E_RUNTIME:?}/dns:/zones:ro"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: "${NAAPP_E2E_POSTGRES_USER:?}"
      POSTGRES_PASSWORD: "${NAAPP_E2E_POSTGRES_PASSWORD:?}"
      POSTGRES_DB: "${NAAPP_E2E_POSTGRES_DB:?}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  awid:
    image: ghcr.io/awebai/awid:0.5.40@sha256:0839d39c97a21de121b6431c93452856967bb92692a633ee821b004c52b87b6b
    dns: ["${NAAPP_E2E_DNS_IP:-127.0.0.11}"]
    environment:
      AWID_DATABASE_URL: "${NAAPP_E2E_DATABASE_URL:?}"
      AWID_REDIS_URL: redis://redis:6379/0
      AWID_DB_SCHEMA: awid
      AWID_HOST: 0.0.0.0
      AWID_PORT: 8010
      AWID_PUBLIC_ORIGINS: http://awid.svc.test:8010
      AWID_RATE_LIMIT_DISABLED: "1"
      # The lane's own registry: the operator token aweb's private-team reads
      # use, generated per run by the test and never written to a file.
      AWID_SERVICE_TOKEN: "${NAAPP_E2E_AWID_SERVICE_TOKEN:?}"
      AWID_ALLOW_INSECURE_DELIVERY_ORIGIN: "1"
      APP_ENV: development
    networks:
      default:
        aliases: ["awid.svc.test"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  aweb:
    image: ghcr.io/awebai/aweb-server:1.27.53@sha256:7a1f71f20da99a79ab20d009a40b410d3966a317482e308e47e90894a9b168ab
    dns: ["${NAAPP_E2E_DNS_IP:-127.0.0.11}"]
    environment:
      AWEB_DATABASE_URL: "${NAAPP_E2E_DATABASE_URL:?}"
      AWEB_REDIS_URL: redis://redis:6379/1
      AWID_REGISTRY_URL: http://awid.svc.test:8010
      AWID_SERVICE_TOKEN: "${NAAPP_E2E_AWID_SERVICE_TOKEN:?}"
      AWEB_PUBLIC_ORIGIN: https://aweb.svc.test
      AWEB_HOST: 0.0.0.0
      AWEB_PORT: 8000
      SSL_CERT_FILE: /runtime/tls/ca.pem
      APP_ENV: development
      # Only the API origins supplied by the lane can be installed here.
      AWEB_APP_INTERNAL_ORIGINS: "${NAAPP_E2E_APP_ORIGINS:?}"
      AWEB_APP_INTERNAL_CIDR: "${NAAPP_E2E_SUBNET:?}"
    volumes:
      - "${NAAPP_E2E_RUNTIME:?}/tls:/runtime/tls:ro"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      awid: {condition: service_started}

  front:
    image: caddy:2.10-alpine
    volumes:
      - "${NAAPP_E2E_RUNTIME:?}/front/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "${NAAPP_E2E_RUNTIME:?}/tls:/tls:ro"
    depends_on:
      aweb: {condition: service_started}

  cli:
    # The published-image stack uses the pinned federation CLI runtime.
    build: {context: "https://github.com/awebai/aweb.git#d8ee9ed31ad275da7cab3a3cade0006e06587f02", dockerfile: scripts/federation-cli.Dockerfile}
    cap_add: [IPC_LOCK]
    dns: ["${NAAPP_E2E_DNS_IP:-127.0.0.11}"]
    entrypoint: ["sleep", "infinity"]
    environment:
      SSL_CERT_FILE: /runtime/tls/ca.pem
      AW_NO_UPDATE_CHECK: "1"
      APP_ENV: development
      # aw's default registry is the public one; every aw in a lane uses the
      # lane's own registry, which the network below makes the only one it
      # can reach.
      AWID_REGISTRY_URL: http://awid.svc.test:8010
