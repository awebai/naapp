[project]
name = "aweb-tasks"
version = "0.1.0"
description = "A team's tasks, the claims on them and its locks, as an aweb app"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "aweb.ai", email = "hello@aweb.ai" }]
requires-python = ">=3.12"
dependencies = [
  "aweb-naapp[runtime]>=0.6.0",
]

[project.urls]
Homepage = "https://github.com/awebai/naapp/tree/main/naapp/tasks"
Repository = "https://github.com/awebai/naapp"
Issues = "https://github.com/awebai/naapp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aweb_tasks"]

# tasks runs on the naapp-lib of the checkout it lives in.
[tool.uv.sources]
aweb-naapp = { path = "../../naapp-lib", editable = true }

[dependency-groups]
dev = [
  "pytest>=9.0.0",
  "ruff>=0.14.0",
  "mypy>=1.18.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
ignore_missing_imports = true
warn_unused_configs = true
